<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Профиль</title>
</head>
<body>
    <div class="top-info">
        <div class="fav-btn">
            <span class="position">
                <img src="./fav-btn.svg" alt="Избранное">
            </span>
        </div>
        <div class="avatar">
            <img src="./Default.svg" alt="Фото профиля">
        </div>
        <div class="user-info">
            <div class="name">Максим Макаров</div>
            <div class="username">@max_makarov</div>
        </div>
    </div>
    <div class="main-btn">
        <div class="btn">
            <span class="list">
                <img src="./list.svg">
            </span>
            <p class="status-text">Учитель</p>
            <span class="arrow">
                <img src="./arrow.svg">
            </span>
        </div>
        <div class="stat">
            <div class="btn2">
                <p class="answer">Количество ответов: </p>
                <p class="counts">24</p>
            </div>

            <div class="arrow-btn">
                <span class="position">
                    <img src="./arrow.svg" alt="Избранное">
                </span>
            </div>
        </div>
    </div>
</body>
</html>
